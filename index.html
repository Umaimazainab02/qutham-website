<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Qutham website</title>
</head>

<body class="">
    <nav class="flex justify-between fixed w-full top-0 items-center   px-10 py-4 border-b border-white/30">
        <div class="flex  items-center gap-90">
            <i class="fa-solid fa-bars text-white text-2xl pl-10"></i>
            <h1 class="text-2xl text-gray-400  font-bold" id="qutham">QUTHAM TECHNOLOGIES</h1>
            <h1 class="text-lg text-white">Careers</h1>
        </div>
        <div class="flex flex-row">
            <h1 class="text-md text-white border border-amber-50 rounded-2xl pl-3 pr-3 pt-1 pb-1 mr-4 ">Courses</h1>

            <div class="w-6 h-6 rounded-full border border-white bg-black flex items-center justify-center mt-1">
                <i class="fa-solid fa-phone text-white text-xs"></i>
            </div>
        </div>
    </nav>


    <!-----Login--->
    <div
        class="mt-20 ml-115 h-120 w-111 border border-white/30 rounded-3xl bg-[rgb(70,66,79)]  flex flex-col items-center pt-8">
        <img src="qutham-tech.svg" alt="" class="w-30 h-9 ">
        <h1 class="text-4xl font-bold text-white pt-3">Welcome</h1>
        <h1 class="text-gray-400 text-sm p-3">Login to access your dashboard</h1>

        <div>
            <h1 class="text-gray-400 pb-2 text-sm">Email Address</h1>
            <input type="text" class="bg-[#E8F0FE] p-3 w-95 rounded-xl">
        </div>

        <div>
            <h1 class="text-gray-400 pb-2 text-sm mt-5">Password</h1>
            <input type="text" class="bg-[#E8F0FE] p-3 w-95 rounded-xl">
        </div>

        <button
            class="bg-gradient-to-r from-purple-900 via-purple-600 to-blue-800 w-95 text-white p-3 rounded-xl mt-5 hover:scale-105 transition duration-500">
            Login </button>

        <p class="text-sm text-gray-400 mt-3 pl-66">Forgot password?</p>
    </div>
    <script src="first.js"></script>
</body>

</html>
